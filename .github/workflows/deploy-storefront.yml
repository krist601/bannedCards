name: Deploy storefront to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-storefront-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out storefront
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate storefront
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter storefront test

      - name: Package storefront source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude='*.log' \
            -czf "$RUNNER_TEMP/storefront.tar.gz" .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail_deploy
          chmod 600 ~/.ssh/lightsail_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload storefront source
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          scp -i ~/.ssh/lightsail_deploy "$RUNNER_TEMP/storefront.tar.gz" "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/banned-cards-storefront.tar.gz"

      - name: Build and restart storefront
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/lightsail_deploy "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            'set -e; mkdir -p /opt/banned-cards/storefront; tar -xzf /tmp/banned-cards-storefront.tar.gz -C /opt/banned-cards/storefront; rm -f /tmp/banned-cards-storefront.tar.gz; cd /opt/banned-cards; docker compose up -d --build storefront caddy; docker compose ps storefront caddy'

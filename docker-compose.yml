services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banned_cards
      POSTGRES_USER: banned_cards
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres-data:
